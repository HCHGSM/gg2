<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام المبيعات المتكامل (POS & ERP)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-blue-950 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white/10 backdrop-blur-xl border border-white/20 p-8 rounded-2xl shadow-2xl w-full max-w-md text-white">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black bg-gradient-to-r from-sky-400 to-indigo-400 bg-clip-text text-transparent">Smart POS & ERP</h1>
            <p class="text-slate-300 text-sm mt-2">نظام المبيعات ونقاط البيع السحابي المتكامل</p>
        </div>

        {% if error %}
        <div class="bg-red-500/20 border border-red-500 text-red-200 px-4 py-3 rounded-xl mb-6 text-sm text-center">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-200 mb-2">اسم المستخدم</label>
                <input type="text" name="username" required placeholder="admin" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-200 mb-2">كلمة المرور</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition duration-200 transform hover:-translate-y-0.5">
                تسجيل الدخول للنظام
            </button>
        </form>

        <div class="mt-8 text-center text-xs text-slate-400 border-t border-white/10 pt-4">
            البيانات الافتراضية: اسم المستخدم <span class="text-sky-400 font-bold">admin</span> | كلمة المرور <span class="text-sky-400 font-bold">admin123</span>
        </div>
    </div>
</body>
</html>
